name: Communicator Compact CI

on:
  push:
    branches:
      - communicator-compact
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: communicator-compact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Communicator Compact Piece 1 through 5 contract
        run: |
          /usr/bin/env bash tests/CommunicatorCompactUiChecks.sh
          /usr/bin/env bash tests/CommunicatorCompactDeliveryChecks.sh
          /usr/bin/env bash tests/CommunicatorCompactPiece4CompleteChecks.sh
          /usr/bin/env bash tests/CommunicatorCompactPiece5Checks.sh
          /usr/bin/env bash tests/CommunicatorCompactAdvertAAChecks.sh

      - name: Setup MeshCore build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Communicator Compact target
        env:
          FIRMWARE_VERSION: compact-v16-piece5-advert-aa
        run: /usr/bin/env bash build.sh build-firmware LilyGo_TDeck_communicator_compact_ble

      - name: Record compact firmware identity
        run: |
          echo "Commit: $GITHUB_SHA"
          ls -lh out
          sha256sum out/*

      - name: Upload Communicator Compact firmware
        uses: actions/upload-artifact@v7
        with:
          name: tdeck-communicator-compact
          path: out/*
          if-no-files-found: error

  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MeshCore build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build standard LilyGO T-Deck BLE communicator
        env:
          FIRMWARE_VERSION: reference
        run: /usr/bin/env bash build.sh build-firmware LilyGo_TDeck_companion_radio_ble

      - name: Record reference firmware identity
        run: |
          echo "Commit: $GITHUB_SHA"
          ls -lh out
          sha256sum out/*

      - name: Upload upstream T-Deck reference firmware
        uses: actions/upload-artifact@v7
        with:
          name: tdeck-upstream-reference
          path: out/*
          if-no-files-found: error
