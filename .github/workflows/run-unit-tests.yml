name: Run Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Keep routine validation on the free public-repository hosted runner, but do
    # not retain .pio output as an Actions artifact. Test logs remain on the run.
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -vv

      - name: Confirm quota-safe test policy
        if: always()
        run: echo "Unit-test run complete; no Actions artifact retained."
